name: Build and deploy ASP.Net Core app to Azure Web App - fyndeer-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build FyndeerAPI.Api/FyndeerAPI.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish FyndeerAPI.Api/FyndeerAPI.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FEBFC334D08B497D8C093A7866BB0549 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B42F38DF4A34461798A0DA2F17F718EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5EA5775D43E4BFD87259C02C5CA6C38 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fyndeer-api'
          slot-name: 'Production'
          package: .
